<!-- Resume Auto-Import Section -->
<div class="card" style="margin-bottom: 2rem; border: 2px dashed #4f46e5; background: #fafafa; padding: 1.5rem; border-radius: 8px;">
    <h3>⚡ One-Click Resume Auto-Import</h3>
    <p style="color: #6b7280; font-size: 0.95rem;">
        Upload your resume (PDF or TXT). Our AI will extract and organize your skills, work experience, education, and projects directly into your profile.
    </p>

    <div style="display: flex; gap: 1rem; align-items: center; margin-top: 1rem;">
        <input type="file" id="resumeAutoUploadInput" accept=".pdf,.txt,.md" style="padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; background: white;" />
        <button id="btnAutoParse" onclick="autoImportResume()" class="btn-primary" style="background: #4f46e5; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
            Import & Populate Profile
        </button>
    </div>

    <div id="parseStatus" style="margin-top: 1rem; font-weight: 500;"></div>
</div>

<script>
async function autoImportResume() {
    const fileInput = document.getElementById('resumeAutoUploadInput');
    const statusDiv = document.getElementById('parseStatus');
    const btn = document.getElementById('btnAutoParse');

    if (!fileInput.files.length) {
        statusDiv.innerHTML = '<span style="color: #dc2626;">Please choose a PDF or TXT file first.</span>';
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    btn.disabled = true;
    btn.innerText = "Parsing with AI...";
    statusDiv.innerHTML = '<span style="color: #2563eb;">Processing and updating profile sections...</span>';

    try {
        const res = await fetch('http://127.0.0.1:8000/profile/parse-and-import', {
            method: 'POST',
            body: formData
        });

        const data = await res.json();

        if (res.ok) {
            statusDiv.innerHTML = `
                <div style="color: #16a34a; background: #dcfce7; padding: 0.75rem; border-radius: 6px;">
                    ✅ <strong>Import Complete!</strong><br>
                    • Profile: <strong>${data.parsed_summary.name}</strong> (${data.parsed_summary.role})<br>
                    • Extracted: ${data.parsed_summary.skills_count} skills, ${data.parsed_summary.experience_entries} jobs, ${data.parsed_summary.education_entries} degrees.
                </div>
            `;
            // If the app has a loadProfile function, refresh the UI:
            if (window.app && typeof window.app.loadProfile === 'function') {
                window.app.loadProfile();
            }
        } else {
            statusDiv.innerHTML = `<span style="color: #dc2626;">❌ Error: ${data.detail || 'Failed to import'}</span>`;
        }
    } catch (err) {
        statusDiv.innerHTML = `<span style="color: #dc2626;">❌ Request failed: ${err.message}</span>`;
    } finally {
        btn.disabled = false;
        btn.innerText = "Import & Populate Profile";
    }
}
</script>
